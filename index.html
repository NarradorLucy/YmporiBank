<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ympori Bank</title>
    <style>
        :root {
            --primary: #2563eb;
            --primary-dark: #1d4ed8;
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --text-color: #f8fafc;
            --text-muted: #94a3b8;
            --accent: #10b981;
            --danger: #ef4444;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .container {
            width: 100%;
            max-width: 480px;
            background-color: var(--card-bg);
            padding: 24px;
            border-radius: 16px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.3);
        }

        h1 {
            text-align: center;
            color: var(--primary);
            margin-bottom: 24px;
            font-size: 1.8rem;
        }

        .balance-card {
            background: linear-gradient(135deg, #1e40af, #2563eb);
            padding: 20px;
            border-radius: 12px;
            text-align: center;
            margin-bottom: 20px;
        }

        .balance-card h2 {
            margin: 0;
            font-size: 1rem;
            color: #cbd5e1;
        }

        .balance-card p {
            font-size: 2.2rem;
            margin: 10px 0 0 0;
            font-weight: bold;
        }

        .section {
            margin-bottom: 20px;
        }

        input, button {
            width: 100%;
            padding: 12px;
            margin-top: 8px;
            border-radius: 8px;
            border: 1px solid #334155;
            background-color: #0f172a;
            color: var(--text-color);
            font-size: 1rem;
            box-sizing: border-box;
        }

        input:focus {
            outline: none;
            border-color: var(--primary);
        }

        button {
            background-color: var(--primary);
            border: none;
            font-weight: bold;
            cursor: pointer;
            transition: background-color 0.2s;
        }

        button:hover {
            background-color: var(--primary-dark);
        }

        .btn-danger {
            background-color: var(--danger);
        }
        .btn-danger:hover {
            background-color: #dc2626;
        }

        .sync-status {
            text-align: center;
            font-size: 0.85rem;
            color: var(--text-muted);
            margin-top: 15px;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>Ympori Bank</h1>

        <div class="balance-card">
            <h2>Saldo Atual</h2>
            <p id="saldoDisplay">R$ 0,00</p>
        </div>

        <div class="section">
            <label for="valorInput">Valor (R$):</label>
            <input type="number" id="valorInput" placeholder="0.00" step="0.01">
            <button onclick="adicionarSaldo()">Adicionar Saldo</button>
        </div>

        <div class="section">
            <button class="btn-danger" onclick="zerarSaldo()">Zerar Conta</button>
        </div>

        <div class="sync-status" id="syncStatus">Conectando à nuvem...</div>
    </div>

    <!-- Script com Firebase e Lógica de Tempo Real -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, doc, setDoc, onSnapshot } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        // COLOQUE AQUI AS SUAS CONFIGURAÇÕES REAIS DO FIREBASE
        const firebaseConfig = {
            apiKey: "SUA_API_KEY",
            authDomain: "SEU_AUTH_DOMAIN",
            projectId: "SEU_PROJECT_ID",
            storageBucket: "SEU_STORAGE_BUCKET",
            messagingSenderId: "SEU_MESSAGING_SENDER_ID",
            appId: "SEU_APP_ID"
        };

        // Inicializar Firebase
        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        // ID fixo do documento para simular a conta sincronizada (mude se quiser separar usuários)
        const docRef = doc(db, "banco", "conta_principal");

        let dadosApp = {
            saldo: 0
        };

        // Função para atualizar a interface visualmente
        function atualizarInterface() {
            document.getElementById("saldoDisplay").innerText = `R$ ${dadosApp.saldo.toFixed(2).replace('.', ',')}`;
        }

        // Ouvir alterações em tempo real vindas do Firestore (celular ou PC)
        onSnapshot(docRef, (docSnap) => {
            const statusEl = document.getElementById("syncStatus");
            if (docSnap.exists()) {
                dadosApp = docSnap.data();
                atualizarInterface();
                statusEl.innerText = "Sincronizado em tempo real ✨";
            } else {
                // Se o documento ainda não existir na nuvem, cria o inicial
                salvarNaNuvem();
                statusEl.innerText = "Conta inicializada na nuvem.";
            }
        }, (error) => {
            console.error("Erro ao sincronizar: ", error);
            document.getElementById("syncStatus").innerText = "Erro de sincronização.";
        });

        // Salvar dados atualizados no Firestore
        async function salvarNaNuvem() {
            try {
                await setDoc(docRef, dadosApp);
            } catch (e) {
                console.error("Erro ao salvar dados: ", e);
            }
        }

        // Funções de Ação do Usuário
        window.adicionarSaldo = function() {
            const input = document.getElementById("valorInput");
            const valor = parseFloat(input.value);

            if (isNaN(valor) || valor <= 0) {
                alert("Por favor, digite um valor válido.");
                return;
            }

            dadosApp.saldo += valor;
            input.value = "";
            salvarNaNuvem();
        };

        window.zerarSaldo = function() {
            if (confirm("Tem certeza que deseja zerar a conta?")) {
                dadosApp.saldo = 0;
                salvarNaNuvem();
            }
        };
    </script>
</body>
</html>
