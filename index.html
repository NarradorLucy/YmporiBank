<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-app.js";
  import { 
    getAuth, 
    createUserWithEmailAndPassword, 
    signInWithEmailAndPassword, 
    onAuthStateChanged,
    signOut 
  } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-auth.js";

  const firebaseConfig = {
    apiKey: "AIzaSyCOuHI6De9YdzuGDpceEcvhCFVNl6oxsDg",
    authDomain: "ymporibank.firebaseapp.com",
    databaseURL: "https://ymporibank-default-rtdb.firebaseio.com",
    projectId: "ymporibank",
    storageBucket: "ymporibank.firebasestorage.app",
    messagingSenderId: "1055800471223",
    appId: "1:1055800471223:web:cd68cad01511ce74672732",
    measurementId: "G-EDBEXSDFE7"
  };

  // Inicializa o app e o serviço de autenticação
  const app = initializeApp(firebaseConfig);
  const auth = getAuth(app);

  /**
   * Cadastrar um novo usuário
   */
  async function cadastrarUsuario(email, senha) {
    try {
      const userCredential = await createUserWithEmailAndPassword(auth, email, senha);
      console.log("Usuário criado com sucesso:", userCredential.user);
      return userCredential.user;
    } catch (error) {
      console.error("Erro ao cadastrar:", error.code, error.message);
      alert(tratarErroFirebase(error.code));
    }
  }

  /**
   * Fazer login de usuário existente
   */
  async function fazerLogin(email, senha) {
    try {
      const userCredential = await signInWithEmailAndPassword(auth, email, senha);
      console.log("Login realizado com sucesso:", userCredential.user);
      return userCredential.user;
    } catch (error) {
      console.error("Erro ao fazer login:", error.code, error.message);
      alert(tratarErroFirebase(error.code));
    }
  }

  /**
   * Fazer logout
   */
  async function fazerLogout() {
    try {
      await signOut(auth);
      console.log("Usuário desconectado");
    } catch (error) {
      console.error("Erro ao desconectar:", error);
    }
  }

  /**
   * Monitorar o estado da autenticação (Sessão do Usuário)
   * Executado automaticamente ao recarregar a página ou mudar o estado de login
   */
  onAuthStateChanged(auth, (user) => {
    if (user) {
      console.log("Usuário atualmente conectado:", user.email, "UID:", user.uid);
      // Aqui você pode redirecionar para a página principal ou exibir o painel
    } else {
      console.log("Nenhum usuário conectado.");
      // Exibir formulário de login
    }
  });

  // Utilitário para tratar mensagens de erro comuns em português
  function tratarErroFirebase(code) {
    switch (code) {
      case 'auth/email-already-in-use':
        return "Este e-mail já está em uso.";
      case 'auth/invalid-email':
        return "Formato de e-mail inválido.";
      case 'auth/weak-password':
        return "A senha deve ter pelo menos 6 caracteres.";
      case 'auth/user-not-found':
      case 'auth/wrong-password':
      case 'auth/invalid-credential':
        return "E-mail ou senha incorretos.";
      default:
        return "Ocorreu um erro ao processar a solicitação.";
    }
  }

  // Torna as funções acessíveis globalmente para vincular aos formulários HTML
  window.cadastrarUsuario = cadastrarUsuario;
  window.fazerLogin = fazerLogin;
  window.fazerLogout = fazerLogout;
</script>
