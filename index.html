<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Realtime Database - Ympori Bank</title>
</head>
<body>

  <h2>Teste de Realtime Database</h2>

  <!-- Formulário para salvar dados -->
  <div>
    <h3>Salvar Transação</h3>
    <input type="text" id="descricao" placeholder="Descrição (ex: Depósito)" />
    <input type="number" id="valor" placeholder="Valor (ex: 150.00)" />
    <button onclick="salvarTransacao()">Salvar</button>
  </div>

  <hr>

  <!-- Exibição dos dados em tempo real -->
  <div>
    <h3>Histórico (Tempo Real)</h3>
    <ul id="lista-transacoes">
      <li>Carregando...</li>
    </ul>
  </div>

  <!-- Firebase Script SDK v12 -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-app.js";
    import { 
      getDatabase, 
      ref, 
      set, 
      push, 
      onValue, 
      get, 
      child 
    } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-database.js";

    const firebaseConfig = {
      apiKey: "AIzaSyCOuHI6De9YdzuGDpceEcvhCFVNl6oxsDg",
      authDomain: "ymporibank.firebaseapp.com",
      databaseURL: "https://ymporibank-default-rtdb.firebaseio.com",
      projectId: "ymporibank",
      storageBucket: "ymporibank.firebasestorage.app",
      messagingSenderId: "1055800471223",
      appId: "1:1055800471223:web:cd68cad01511ce74672732",
      measurementId: "G-EDBEXSDFE7"
    };

    // Inicializa o Firebase e o Realtime Database
    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);

    /**
     * 1. SALVAR DADOS (Escrita)
     * Usa 'push' para gerar uma chave única automática para cada novo registro.
     */
    async function salvarTransacao() {
      const descricao = document.getElementById("descricao").value;
      const valor = parseFloat(document.getElementById("valor").value);

      if (!descricao || isNaN(valor)) {
        alert("Preencha os campos corretamente.");
        return;
      }

      try {
        // Cria uma nova referência com ID automático dentro do nó "transacoes"
        const transacoesRef = ref(db, "transacoes");
        const novaTransacaoRef = push(transacoesRef);

        // Salva os dados no caminho gerado
        await set(novaTransacaoRef, {
          descricao: descricao,
          valor: valor,
          data: new Date().toISOString()
        });

        console.log("Dados salvos com ID:", novaTransacaoRef.key);
        document.getElementById("descricao").value = "";
        document.getElementById("valor").value = "";
      } catch (error) {
        console.error("Erro ao salvar no Realtime Database:", error);
      }
    }

    /**
     * 2. LER DADOS EM TEMPO REAL (Escuta Contínua)
     * 'onValue' executa imediatamente e dispara de novo a cada alteração no nó.
     */
    function escutarTransacoes() {
      const transacoesRef = ref(db, "transacoes");

      onValue(transacoesRef, (snapshot) => {
        const lista = document.getElementById("lista-transacoes");
        lista.innerHTML = ""; // Limpa a lista antes de reordenar

        if (snapshot.exists()) {
          const dados = snapshot.val();

          // Iterar sobre os itens retornados
          Object.keys(dados).forEach((id) => {
            const item = dados[id];
            const li = document.createElement("li");
            li.textContent = `${item.descricao}: R$ ${item.valor.toFixed(2)}`;
            lista.appendChild(li);
          });
        } else {
          lista.innerHTML = "<li>Nenhuma transação encontrada.</li>";
        }
      });
    }

    /**
     * 3. LER DADOS APENAS UMA VEZ (Consulta Única)
     * Use 'get' quando não precisar de atualizações em tempo real.
     */
    async function lerDadosUmaVez() {
      try {
        const dbRef = ref(db);
        const snapshot = await get(child(dbRef, "transacoes"));
        if (snapshot.exists()) {
          console.log("Consulta pontual:", snapshot.val());
        } else {
          console.log("Nenhum dado encontrado.");
        }
      } catch (error) {
        console.error("Erro na leitura pontual:", error);
      }
    }

    // Inicia a escuta em tempo real assim que a página carrega
    escutarTransacoes();

    // Expõe funções para os botões do HTML
    window.salvarTransacao = salvarTransacao;
    window.lerDadosUmaVez = lerDadosUmaVez;
  </script>
</body>
</html>
